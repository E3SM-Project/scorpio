---
#
# ========== SCORPIO testing after merging to develop branch for releases ======
# If a PR has a "Release PR" label,
# 1) Merge branch to develop (locally)
# 2) Run tests with PnetCDF
# The tests are run on a single node (with PnetCDF)
# (Note: The merge to develop is "local" and the changes are NOT pushed to remote)
#
# FIXME: Use this workflow for testing PRs after merging to develop
name: SCORPIO Release PR testing after merge to develop

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch to run the SCORPIO + PnetCDF tests after local merge to develop'
        required: true
  pull_request:
    types: [labeled]

jobs:
  merge_and_test:
    # Only merge PRs with 'Release PR' label to develop
    if: ((github.event_name == 'pull_request' && github.event.label.name == 'Release PR') || (github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest

    permissions:
      # This workflow needs to read the PR desc
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch depth 0 : Clone the entire history of all branches/tags
          # (Required to fetch all branches and history for a successful merge)
          # Note: If fetch depth is not specified, the default fetch depth is 1 (only latest commit)
          fetch-depth: 0

      # Explicitly indicate that its the Github BOT performing the merge
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Merge branch to develop
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_SUBJECT: "CI: Auto merge branch origin/${{ github.event.pull_request.head.ref }} into develop (PR #${{ github.event.pull_request.number }})"
        run: |
          PR_DESC=$(gh pr view "${PR_NUMBER}" --json body --jq '.body')
          git fetch origin
          git fetch origin "${BRANCH_NAME}"
          git checkout develop
          git pull origin develop

          # Perform the merge operation
          git merge origin/"${BRANCH_NAME}" --no-ff -m "${PR_SUBJECT}" -m "${PR_DESC}"

      - name: Test merged code
        uses: ./.github/actions/spio_pnetcdf_testing
        with:
          branch_name: develop
          checkout_repo: false
          install_sw: true
